<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vault Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic Steel Rim Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Teeth Gradient -->
    <linearGradient id="teethGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="vaultShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#vaultShadow)">
    <!-- 12 Industrial Vault Cog Teeth -->
    <g transform="translate(256, 256)">
      <!-- Cog teeth placed radially -->
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(30)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(60)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(90)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(120)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(150)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(180)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(210)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(240)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(270)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(300)" />
      <path d="M-22,-242 L22,-242 L18,-205 L-18,-205 Z" fill="url(#teethGrad)" transform="rotate(330)" />

      <!-- Heavy Outer Blast Ring -->
      <circle cx="0" cy="0" r="215" fill="url(#steelGrad)" stroke="url(#goldGrad)" stroke-width="12" />

      <!-- Hazard Ring with subtle grooves -->
      <circle cx="0" cy="0" r="185" fill="none" stroke="#090d16" stroke-width="8" stroke-dasharray="24 16" />

      <!-- Inner Armor Bulkhead -->
      <circle cx="0" cy="0" r="165" fill="url(#coreGrad)" stroke="url(#goldGrad)" stroke-width="5" />

      <!-- 8 Heavy Industrial Hex Bolts -->
      <circle cx="0" cy="-140" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="99" cy="-99" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="140" cy="0" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="99" cy="99" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="0" cy="140" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="-99" cy="99" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="-140" cy="0" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
      <circle cx="-99" cy="-99" r="9" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />

      <!-- Central Wheel Hub Rim -->
      <circle cx="0" cy="0" r="110" fill="#0a0e17" stroke="url(#goldGrad)" stroke-width="6" />

      <!-- Central "SD" Monogram Typography -->
      <text
        x="0"
        y="28"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="94"
        font-weight="900"
        letter-spacing="2"
        fill="url(#goldGrad)"
      >SD</text>

      <!-- Subtitle Vault Arc text -->
      <text
        x="0"
        y="78"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="6"
        fill="#94a3b8"
      >VAULT</text>
    </g>
  </g>
</svg>